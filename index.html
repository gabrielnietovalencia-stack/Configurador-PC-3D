<!DOCTYPE html>
<html lang="es">
<head>

<title>PC Builder 3D — Configurador</title>
<link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">

<style>
:root {
    --cyan:    #00ffff;
    --cyan2:   #00c8c8;
    --dark:    #080b12;
    --panel:   rgba(8, 11, 20, 0.93);
    --border:  rgba(0, 255, 255, 0.16);
    --text:    #c8d8e8;
    --muted:   #4a6070;
    --red:     #ef4444;
    --green:   #22c55e;
    --yellow:  #eab308;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { overflow: hidden; font-family: 'Rajdhani', sans-serif; background: var(--dark); cursor: crosshair; }
canvas { display: block; }

#pantalla-carga {
    position: fixed; inset: 0; background: var(--dark);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 9999; transition: opacity 0.6s; gap: 20px;
}
.spinner-ring {
    width: 60px; height: 60px;
    border: 2px solid rgba(0,255,255,0.1); border-top: 2px solid var(--cyan);
    border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
