<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PC Builder 3D</title>

<style>

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #1e293b, #0f172a, #020617);
}

/* CANVAS */
canvas {
    display: block;
}

/* LOADING */
#pantalla-carga {
    position: fixed;
    inset: 0;
    background: #020617;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 0.5s;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #1f2937;
    border-top: 4px solid #00ffff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

/* MENU */
#menu {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 260px;
    padding: 15px;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #334155;
    border-radius: 12px;
    color: white;
    backdrop-filter: blur(10px);
}

h3 {
    margin: 0 0 10px 0;
    color: #00ffff;
}

/* BOTONES */
button {
    width: 100%;
    padding: 8px;
    margin-bottom: 6px;
    background: #1e293b;
    color: white;
    border: 1px solid #334155;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 12px;
}

button:hover {
    background: #00ffff;
    color: black;
}

/* SECCIONES */
.seccion {
    margin-bottom: 12px;
}

.titulo-sec {
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 5px;
    text-transform: uppercase;
}

/* TOTAL */
#total-box {
    margin-top: 12px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(0, 255, 255, 0.08);
    border: 1px solid #00ffff;
    text-align: center;
    color: #00ffff;
}

/* RESUMEN */
#resumen {
    margin-top: 10px;
    font-size: 12px;
    color: #cbd5e1;
}

/* RESET */
.btn-reset {
    margin-top: 10px;
    background: #7f1d1d;
    border: 1px solid #ef4444;
}

.btn-reset:hover {
    background: #ef4444;
    color: white;
}

/* INSTRUCCIONES */
#instrucciones {
    position: absolute;
    bottom: 15px;
    width: 100%;
    text-align: center;
    color: #38bdf8;
    font-size: 12px;
}

</style>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="instrucciones">
💡 Click + arrastrar para mover cámara | Rueda zoom
</div>

<div id="pantalla-carga">
<div class="spinner"></div>
<p style="color:white">Cargando PC Builder...</p>
</div>

<div id="menu">

<h3>PC Builder 3D</h3>

<div class="seccion">
<div class="titulo-sec">Caja</div>

<button onclick="cambiarComponente('caja','case_corsair.glb','Corsair',150)">
Corsair Case
</button>

<button onclick="cambiarComponente('caja','case_fractal.glb','Fractal',180)">
Fractal Case
</button>
</div>

<div class="seccion">
<div class="titulo-sec">Placa Base</div>

<button onclick="cambiarComponente('placa','mobo_pro.glb','ASUS Pro',350)">
ASUS Pro
</button>

<button onclick="cambiarComponente('placa','mobo_generic.glb','Genérica',120)">
Genérica
</button>
</div>

<div class="seccion">
<div class="titulo-sec">GPU</div>

<button onclick="cambiarComponente('grafica','gpu_4090.glb','RTX 4090',2000)">
RTX 4090
</button>

<button onclick="cambiarComponente('grafica','gpu_3090.glb','RTX 3090',1200)">
RTX 3090
</button>

</div>

<div id="resumen">
<div id="txt-caja">Caja: -</div>
<div id="txt-placa">Placa: -</div>
<div id="txt-grafica">GPU: -</div>
</div>

<div id="total-box">
TOTAL: <strong id="precio-total">0</strong> €
</div>

<button class="btn-reset" onclick="reiniciarPC()">
🗑 Reset PC
</button>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
